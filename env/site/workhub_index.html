<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WorkHub Admin Console</title>
  <link rel="stylesheet" href="../../src/env/static/css/shoplane_sandbox.css" />
  <link rel="stylesheet" href="../../src/env/static/css/workhub_admin.css" />
  <script defer src="../../src/env/static/js/sandbox_state.js"></script>
  <script defer src="../../src/env/static/js/shoplane_pages.js"></script>
</head>
<body class="workhub-sandbox wh-body" data-page="workhub_index">
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-logo">
        WorkHub
        <small>Admin Console</small>
      </div>
      <div class="site-actions">
        <div class="action-block"><span>Task</span><strong id="site-task-name">Loading…</strong></div>
        <div class="action-block is-hidden"><span>Condition</span><strong id="site-condition">—</strong></div>
        <div class="action-block"><span>Session</span><strong id="site-cart-count">—</strong></div>
      </div>
    </div>
  </header>

  <div class="site-subnav">
    <div class="site-subnav__inner wh-subnav">
      <a href="../dashboard/index.html" id="nav-dashboard" class="nav-dashboard-pill">Benchmark Home</a>
      <a href="#" data-wh-nav="workhub_index">App approvals</a>
      <a href="#" data-wh-nav="workhub_setup">App setup</a>
      <a href="#" data-wh-nav="irrelevant">Directory (read-only)</a>
    </div>
  </div>

  <main class="shell wh-shell-host">
    <div class="breadcrumb" id="site-breadcrumb">WorkHub</div>
    <div class="top-meta" id="site-topmeta"></div>
    <div id="page-content">
      <section class="wh-section bench-shell-loading" style="max-width:900px;margin:24px auto;">
        <p class="wh-section__sub">Loading WorkHub…</p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>WorkHub is a local benchmark surface for research</span>
    </div>
  </footer>
</body>
</html>
